[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-da-musica-agent"
version = "1.0.0"
description = "Hybrid ReAct + RAG AI Customer Support Agent for Empório da Música"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "pypdf>=4.2.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "rapidfuzz>=3.9.0",
    "rich>=13.7.0",
    "streamlit>=1.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
